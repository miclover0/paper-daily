<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Paper Daily - 2026年05月29日</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
               background: #0d1117; color: #c9d1d9; line-height: 1.6; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        
        header { text-align: center; padding: 40px 0 30px; border-bottom: 1px solid #21262d; margin-bottom: 40px; }
        header h1 { font-size: 2rem; color: #58a6ff; margin-bottom: 8px; }
        header p { color: #8b949e; font-size: 0.9rem; }
        
        .stats { display: flex; justify-content: center; gap: 30px; margin-top: 20px; }
        .stat { text-align: center; }
        .stat .num { font-size: 1.8rem; font-weight: 700; color: #58a6ff; }
        .stat .label { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; }
        
        .group-section { margin-bottom: 50px; }
        .group-header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 20px;
                        padding-bottom: 12px; border-bottom: 2px solid #21262d; }
        .group-title { font-size: 1.3rem; color: #f0883e; }
        .group-desc { color: #8b949e; font-size: 0.85rem; }
        
        .paper-list { display: flex; flex-direction: column; gap: 16px; }
        .paper-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px;
                       transition: border-color 0.2s; }
        .paper-card:hover { border-color: #58a6ff; }
        .paper-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 8px; }
        .paper-title { font-size: 1rem; font-weight: 600; flex: 1; }
        .paper-title a { color: #58a6ff; text-decoration: none; }
        .paper-title a:hover { text-decoration: underline; }
        .paper-meta { display: flex; gap: 8px; flex-shrink: 0; }
        .paper-date, .paper-cat { font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; background: #21262d; color: #8b949e; }
        .paper-authors { font-size: 0.8rem; color: #8b949e; margin-bottom: 10px; }
        .paper-abstract { font-size: 0.85rem; color: #b1bac4; margin-bottom: 14px; line-height: 1.7; }
        .paper-actions { display: flex; gap: 12px; }
        .paper-actions a { font-size: 0.8rem; text-decoration: none; color: #58a6ff; padding: 4px 12px;
                           border: 1px solid #30363d; border-radius: 6px; transition: all 0.2s; }
        .paper-actions a:hover { background: #21262d; border-color: #58a6ff; }
        
        footer { text-align: center; padding: 40px 0; color: #8b949e; font-size: 0.8rem;
                 border-top: 1px solid #21262d; margin-top: 40px; }
        
        @media (max-width: 600px) {
            .paper-header { flex-direction: column; }
            .stats { gap: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Paper Daily</h1>
            <p>每日 AI 论文精选简报 · 自动抓取 arXiv</p>
            <div class="stats">
                <div class="stat"><div class="num">0</div><div class="label">论文总数</div></div>
                <div class="stat"><div class="num">2026年05月29日</div><div class="label">更新日期</div></div>
            </div>
        </header>
        
        <div class="content">

        </div>
        
        <footer>
            由 <strong>QClaw</strong> 自动生成 & 推送 · 每小时更新一次<br>
            仓库地址: <a href="https://github.com/miclover0/paper-daily" style="color:#58a6ff">miclover0/paper-daily</a>
        </footer>
    </div>
</body>
</html>
