<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Intelligence Daily Archive</title>
    
    <!-- SF Pro Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ========== CSS Variables ========== */
        :root {
            /* Dark Theme (Default) */
            --bg-primary: #1a1a1e;
            --bg-secondary: #0d0d0f;
            --bg-column: rgba(30, 30, 35, 0.85);
            --bg-item: rgba(255, 255, 255, 0.04);
            --bg-item-hover: rgba(0, 122, 255, 0.15);
            --bg-item-active: rgba(0, 122, 255, 0.95);
            --text-primary: #f5f5f7;
            --text-secondary: #98989d;
            --text-active: #ffffff;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-color: #007aff;
            --accent-glow: rgba(0, 122, 255, 0.3);
            --glass-blur: blur(20px);
            
            /* Spacing */
            --column-width: 260px;
            --column-gap: 1px;
            --item-height: 36px;
            --padding-md: 12px;
            --padding-lg: 16px;
            
            /* Typography */
            --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
            --font-mono: 'SF Mono', 'Menlo', monospace;
        }

        /* Light Theme */
        [data-theme="light"] {
            --bg-primary: #f5f5f7;
            --bg-secondary: #ffffff;
            --bg-column: rgba(255, 255, 255, 0.85);
            --bg-item: rgba(0, 0, 0, 0.02);
            --bg-item-hover: rgba(0, 122, 255, 0.08);
            --bg-item-active: rgba(0, 122, 255, 0.95);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --text-active: #ffffff;
            --border-color: rgba(0, 0, 0, 0.08);
        }

        /* ========== Reset & Base ========== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ========== Background ========== */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at top left, rgba(0, 122, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at bottom right, rgba(175, 82, 222, 0.15) 0%, transparent 50%);
            z-index: -1;
        }

        /* ========== Layout ========== */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ========== Header ========== */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: var(--padding-md) var(--padding-lg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--padding-md);
        }

        .header-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #007aff 0%, #5856d6 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .header-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: var(--padding-md);
        }

        .header-stat {
            font-size: 12px;
            color: var(--text-secondary);
            padding: 4px 10px;
            background: var(--bg-item);
            border-radius: 12px;
            font-weight: 500;
        }

        .theme-btn {
            width: 32px;
            height: 32px;
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .theme-btn:hover {
            background: var(--bg-item-hover);
        }

        /* ========== Breadcrumb ========== */
        .breadcrumb {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 8px var(--padding-lg);
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .breadcrumb-item {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .breadcrumb-item:hover {
            background: var(--bg-item-hover);
            color: var(--text-primary);
        }

        .breadcrumb-item.active {
            color: var(--accent-color);
            font-weight: 500;
        }

        .breadcrumb-separator {
            color: var(--text-secondary);
            opacity: 0.4;
        }

        /* ========== Columns Container ========== */
        .columns-wrapper {
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            background: var(--bg-secondary);
        }

        .columns-container {
            display: flex;
            height: 100%;
            min-width: max-content;
        }

        /* ========== Column ========== */
        .column {
            width: var(--column-width);
            min-width: var(--column-width);
            height: 100%;
            background: var(--bg-column);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            animation: slideIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .column-header {
            padding: var(--padding-md) var(--padding-lg);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.1);
        }

        .column-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 4px 0;
        }

        /* Scrollbar */
        .column-content::-webkit-scrollbar {
            width: 6px;
        }

        .column-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .column-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .column-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ========== Item ========== */
        .item {
            padding: 0 var(--padding-lg);
            height: var(--item-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            font-size: 13px;
        }

        .item:hover {
            background: var(--bg-item-hover);
        }

        .item.active {
            background: var(--bg-item-active);
            color: var(--text-active);
        }

        .item.active .item-icon {
            color: var(--text-active);
        }

        .item-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .item-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-count {
            font-size: 11px;
            color: var(--text-secondary);
            background: var(--bg-item);
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 8px;
        }

        .item.active .item-count {
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-active);
        }

        .item-arrow {
            width: 14px;
            height: 14px;
            color: var(--text-secondary);
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .item:hover .item-arrow {
            opacity: 1;
        }

        .item.active .item-arrow {
            color: var(--text-active);
            opacity: 1;
        }

        /* ========== Detail Panel ========== */
        .detail-panel {
            width: 100%;
            min-width: 400px;
            flex: 1;
            background: var(--bg-column);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            animation: slideIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .detail-header {
            padding: var(--padding-lg);
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.1);
        }

        .detail-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: var(--accent-color);
            color: white;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .detail-title {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .detail-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .detail-content {
            flex: 1;
            overflow-y: auto;
            padding: var(--padding-lg);
        }

        .detail-section {
            margin-bottom: var(--padding-lg);
        }

        .detail-section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .detail-authors {
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .detail-summary {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.7;
            padding: 12px;
            background: var(--bg-item);
            border-radius: 8px;
            border-left: 3px solid var(--accent-color);
        }

        .detail-highlights {
            list-style: none;
        }

        .detail-highlights li {
            padding: 8px 12px;
            margin-bottom: 6px;
            background: var(--bg-item);
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .detail-highlights li::before {
            content: "→";
            color: var(--accent-color);
            font-weight: 600;
        }

        .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .detail-tag {
            padding: 4px 10px;
            background: rgba(0, 122, 255, 0.15);
            color: var(--accent-color);
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .detail-footer {
            padding: var(--padding-lg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .btn-primary {
            flex: 1;
            padding: 12px 20px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: #0051d5;
            transform: translateY(-1px);
        }

        .btn-secondary {
            padding: 12px 20px;
            background: var(--bg-item);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: var(--bg-item-hover);
        }

        /* ========== Empty State ========== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
            padding: var(--padding-lg);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-text {
            font-size: 14px;
        }

        /* ========== Responsive ========== */
        @media (max-width: 768px) {
            :root {
                --column-width: 240px;
            }
            
            .header-stat {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="header-icon">📚</div>
                <div class="header-title">Vision Intelligence Daily Archive</div>
            </div>
            <div class="header-right">
                <div class="header-stat" id="stat-papers">-- Papers</div>
                <div class="header-stat" id="stat-days">-- Days</div>
                <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme">
                    <span id="theme-icon">🌙</span>
                </button>
            </div>
        </header>

        <!-- Breadcrumb -->
        <nav class="breadcrumb" id="breadcrumb">
            <span class="breadcrumb-item active">Archive</span>
        </nav>

        <!-- Columns -->
        <div class="columns-wrapper">
            <div class="columns-container" id="columns-container">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>

    <!-- Config -->
    <script src="config.js"></script>
    
    <script>
        // ========== Theme Toggle ==========
        const THEME_KEY = 'vid-archive-theme';
        
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
                icon.textContent = '🌙';
                localStorage.setItem(THEME_KEY, 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                icon.textContent = '☀️';
                localStorage.setItem(THEME_KEY, 'light');
            }
        }

        // Initialize theme
        if (localStorage.getItem(THEME_KEY) === 'light') {
            document.body.setAttribute('data-theme', 'light');
            document.getElementById('theme-icon').textContent = '☀️';
        }

        // ========== State Management ==========
        const state = {
            selectedYearMonth: null,
            selectedDate: null,
            selectedPaper: null,
            data: null
        };

        // ========== Data Processing ==========
        function processData(config) {
            const data = {};
            
            config.dailyReports.forEach(day => {
                const [year, month, date] = day.date.split('-');
                const key = `${year}-${month}`;
                
                if (!data[key]) {
                    data[key] = {
                        label: `${year}年${month}月`,
                        year: year,
                        month: month,
                        dates: {}
                    };
                }
                
                data[key].dates[day.date] = {
                    label: `${month}-${date}`,
                    weekday: day.weekday,
                    paperCount: day.paperCount,
                    filename: day.filename,
                    papers: day.papers
                };
            });
            
            return data;
        }

        // ========== Render Functions ==========
        function renderColumn1() {
            const container = document.getElementById('columns-container');
            const items = Object.entries(state.data).sort((a, b) => b[0].localeCompare(a[0]));
            
            let html = `
                <div class="column" id="column-1">
                    <div class="column-header">年/月</div>
                    <div class="column-content">
            `;
            
            items.forEach(([key, value]) => {
                const isActive = state.selectedYearMonth === key;
                html += `
                    <div class="item ${isActive ? 'active' : ''}" onclick="selectYearMonth('${key}')">
                        <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <span class="item-text">${value.label}</span>
                        <span class="item-count">${Object.keys(value.dates).length}</span>
                        <svg class="item-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderColumn2() {
            if (!state.selectedYearMonth) return;
            
            const container = document.getElementById('columns-container');
            const column1 = document.getElementById('column-1');
            
            const yearMonthData = state.data[state.selectedYearMonth];
            const dates = Object.entries(yearMonthData.dates).sort((a, b) => b[0].localeCompare(a[0]));
            
            let html = `
                <div class="column" id="column-2">
                    <div class="column-header">日期</div>
                    <div class="column-content">
            `;
            
            dates.forEach(([dateKey, value]) => {
                const isActive = state.selectedDate === dateKey;
                html += `
                    <div class="item ${isActive ? 'active' : ''}" onclick="selectDate('${dateKey}')">
                        <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        <span class="item-text">${value.label} (${value.weekday.slice(0, 3)})</span>
                        <span class="item-count">${value.paperCount}</span>
                        <svg class="item-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            
            // Remove old column 2 and detail panel
            const oldColumn2 = document.getElementById('column-2');
            const oldDetail = document.querySelector('.detail-panel');
            if (oldColumn2) oldColumn2.remove();
            if (oldDetail) oldDetail.remove();
            
            column1.insertAdjacentHTML('afterend', html);
        }

        function renderColumn3() {
            if (!state.selectedDate) return;
            
            const container = document.getElementById('columns-container');
            const column2 = document.getElementById('column-2');
            
            const yearMonthData = state.data[state.selectedYearMonth];
            const dateData = yearMonthData.dates[state.selectedDate];
            
            let html = `
                <div class="column" id="column-3">
                    <div class="column-header">论文标题</div>
                    <div class="column-content">
            `;
            
            dateData.papers.forEach((paper, index) => {
                const isActive = state.selectedPaper === index;
                html += `
                    <div class="item ${isActive ? 'active' : ''}" onclick="selectPaper(${index})">
                        <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                        </svg>
                        <span class="item-text">${paper.title.length > 40 ? paper.title.substring(0, 40) + '...' : paper.title}</span>
                        <svg class="item-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            
            // Remove old column 3 and detail panel
            const oldColumn3 = document.getElementById('column-3');
            const oldDetail = document.querySelector('.detail-panel');
            if (oldColumn3) oldColumn3.remove();
            if (oldDetail) oldDetail.remove();
            
            column2.insertAdjacentHTML('afterend', html);
        }

        function renderDetailPanel() {
            if (state.selectedPaper === null) return;
            
            const container = document.getElementById('columns-container');
            const column3 = document.getElementById('column-3');
            
            const yearMonthData = state.data[state.selectedYearMonth];
            const dateData = yearMonthData.dates[state.selectedDate];
            const paper = dateData.papers[state.selectedPaper];
            
            const html = `
                <div class="detail-panel">
                    <div class="detail-header">
                        <div class="detail-badge">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                            </svg>
                            ${paper.group} · ${paper.id}
                        </div>
                        <div class="detail-title">${escapeHtml(paper.title)}</div>
                        <div class="detail-meta">
                            <span>📅 ${dateData.label}</span>
                            <span>👥 ${paper.authors.slice(0, 3).join(', ')}</span>
                            <span>📍 ${paper.venue}</span>
                        </div>
                    </div>
                    <div class="detail-content">
                        <div class="detail-section">
                            <div class="detail-section-title">标签</div>
                            <div class="detail-tags">
                                ${paper.tags.map(tag => `<span class="detail-tag">${escapeHtml(tag)}</span>`).join('')}
                            </div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-section-title">作者</div>
                            <div class="detail-authors">${paper.authors.join(', ')}</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-section-title">摘要</div>
                            <div class="detail-summary">${escapeHtml(paper.summary)}</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-section-title">核心亮点</div>
                            <ul class="detail-highlights">
                                ${paper.highlights.map(h => `<li>${escapeHtml(h)}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                    <div class="detail-footer">
                        <button class="btn-primary" onclick="openFullReport('${dateData.filename}')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                <polyline points="15 3 21 3 21 9"></polyline>
                                <line x1="10" y1="14" x2="21" y2="3"></line>
                            </svg>
                            查看完整日报 HTML
                        </button>
                        <button class="btn-secondary" onclick="openPdf('${paper.pdfUrl}')">
                            PDF
                        </button>
                    </div>
                </div>
            `;
            
            // Remove old detail panel
            const oldDetail = document.querySelector('.detail-panel');
            if (oldDetail) oldDetail.remove();
            
            column3.insertAdjacentHTML('afterend', html);
        }

        function renderEmptyState() {
            const container = document.getElementById('columns-container');
            container.innerHTML = `
                <div class="column" style="flex: 1;">
                    <div class="empty-state">
                        <div class="empty-icon">📚</div>
                        <div class="empty-text">选择左侧年/月开始浏览</div>
                    </div>
                </div>
            `;
        }

        // ========== Selection Handlers ==========
        function selectYearMonth(key) {
            state.selectedYearMonth = key;
            state.selectedDate = null;
            state.selectedPaper = null;
            
            renderColumn1();
            renderColumn2();
            updateBreadcrumb();
            
            // Remove column 3 and detail panel
            const column3 = document.getElementById('column-3');
            const detail = document.querySelector('.detail-panel');
            if (column3) column3.remove();
            if (detail) detail.remove();
        }

        function selectDate(dateKey) {
            state.selectedDate = dateKey;
            state.selectedPaper = null;
            
            renderColumn2();
            renderColumn3();
            updateBreadcrumb();
            
            // Remove detail panel
            const detail = document.querySelector('.detail-panel');
            if (detail) detail.remove();
        }

        function selectPaper(index) {
            state.selectedPaper = index;
            
            renderColumn3();
            renderDetailPanel();
            updateBreadcrumb();
        }

        // ========== Breadcrumb ==========
        function updateBreadcrumb() {
            const breadcrumb = document.getElementById('breadcrumb');
            let html = `<span class="breadcrumb-item" onclick="resetToRoot()">Archive</span>`;
            
            if (state.selectedYearMonth) {
                const yearMonthData = state.data[state.selectedYearMonth];
                html += `
                    <span class="breadcrumb-separator">›</span>
                    <span class="breadcrumb-item ${state.selectedDate ? '' : 'active'}" onclick="selectYearMonth('${state.selectedYearMonth}')">${yearMonthData.label}</span>
                `;
            }
            
            if (state.selectedDate) {
                const yearMonthData = state.data[state.selectedYearMonth];
                const dateData = yearMonthData.dates[state.selectedDate];
                html += `
                    <span class="breadcrumb-separator">›</span>
                    <span class="breadcrumb-item ${state.selectedPaper !== null ? '' : 'active'}" onclick="selectDate('${state.selectedDate}')">${dateData.label}</span>
                `;
            }
            
            if (state.selectedPaper !== null) {
                const yearMonthData = state.data[state.selectedYearMonth];
                const dateData = yearMonthData.dates[state.selectedDate];
                const paper = dateData.papers[state.selectedPaper];
                const shortTitle = paper.title.length > 30 ? paper.title.substring(0, 30) + '...' : paper.title;
                html += `
                    <span class="breadcrumb-separator">›</span>
                    <span class="breadcrumb-item active">${shortTitle}</span>
                `;
            }
            
            breadcrumb.innerHTML = html;
        }

        function resetToRoot() {
            state.selectedYearMonth = null;
            state.selectedDate = null;
            state.selectedPaper = null;
            
            renderColumn1();
            updateBreadcrumb();
            
            // Remove other columns
            const column2 = document.getElementById('column-2');
            const column3 = document.getElementById('column-3');
            const detail = document.querySelector('.detail-panel');
            if (column2) column2.remove();
            if (column3) column3.remove();
            if (detail) detail.remove();
        }

        // ========== Utility Functions ==========
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openFullReport(filename) {
            window.location.href = `./daily_reports/${filename.replace('daily_reports/', '')}`;
        }

        function openPdf(url) {
            window.open(url, '_blank');
        }

        // ========== Initialize ==========
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof PAPER_ARCHIVE_CONFIG !== 'undefined') {
                const config = PAPER_ARCHIVE_CONFIG;
                
                // Update stats
                document.getElementById('stat-papers').textContent = `${config.meta.totalPapers} Papers`;
                document.getElementById('stat-days').textContent = `${config.meta.totalDays} Days`;
                
                // Process data
                state.data = processData(config);
                
                // Render first column
                renderColumn1();
                
                console.log('📚 Vision Intelligence Daily Archive loaded successfully');
            } else {
                console.error('❌ Failed to load config.js');
            }
        });
    </script>
</body>
</html>
